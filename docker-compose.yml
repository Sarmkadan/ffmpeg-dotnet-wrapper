# =============================================================================
# Docker Compose for FFmpeg .NET Wrapper
# Author: Vladyslav Zaiets | https://sarmkadan.com
# =============================================================================

version: '3.8'

services:
  ffmpeg-wrapper:
    image: ffmpeg-wrapper:latest
    container_name: ffmpeg-wrapper
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./data/input:/data/input:ro
      - ./data/output:/data/output:rw
      - ./data/temp:/tmp/ffmpeg-work:rw
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Production
      FFmpegOptions__MaxConcurrentOperations: 4
      FFmpegOptions__DefaultTimeout: "00:10:00"
      FFmpegOptions__WorkingDirectory: /tmp/ffmpeg-work
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ffmpeg-work:
    driver: local
