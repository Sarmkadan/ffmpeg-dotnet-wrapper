name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # All projects target net10.0 and global.json pins SDK 10.0.100 (rollForward latestMinor).
        dotnet-version: '10.0.x'

    - name: Install FFmpeg
      # MediaProbeServiceIntegrationTests run the real ffprobe binary (ships with the ffmpeg package).
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Restore
      run: dotnet restore ffmpeg-dotnet-wrapper.slnx

    - name: Build
      run: dotnet build ffmpeg-dotnet-wrapper.slnx --no-restore -c Release

    - name: Test
      run: dotnet test ffmpeg-dotnet-wrapper.slnx --no-build -c Release --verbosity normal
